# Which model and which provider each task uses.
#
# This file is the source of truth. Environment variables still override it —
# see documentation/reference/llm-config.md for the precedence table.
#
# API keys are NEVER written here. A provider names the environment variable
# its key is read from; the value stays in .env / Secret Manager.

version: 1

# Declared once, referenced by name from `roles` and `embedding`.
#
# `kind` is the wire protocol: openai_compatible, gemini, or none. A `none`
# provider needs no base_url and no api_key_env — it constructs without
# credentials and raises LLMDisabledError if anything calls it, which is how a
# process runs its non-LLM steps with no keys configured. Declare one and point
# a single role at it, or set LLM_PROVIDER=none to disable every role at once.
providers:
  berget:
    kind: openai_compatible
    base_url: https://api.berget.ai/v1
    api_key_env: BERGET_API_KEY
  gemini:
    kind: gemini
    api_key_env: GEMINI_API_KEY

# Inherited by every role that omits the field.
defaults:
  provider: berget
  temperature: 0.0
  max_tokens: null
  # Asking for token usage on a stream is an extra request parameter, and a host
  # that rejects it fails the whole call. Streaming is the user-facing chat path.
  stream_usage: true

# One entry per task. Add a role here and call `create_llm_provider("<name>")` —
# no Python change is needed to introduce one.
roles:
  # High-volume, JSON-schema output: query decomposition, metadata and entity
  # extraction, reranking. Runs at ingestion scale, so it wants a cheap model.
  structured:
    model: mistralai/Mistral-Small-3.2-24B-Instruct-2506

  # One call per ingested document, no structured output, sees whole documents —
  # so it wants context length more than it wants to be cheap.
  summarize:
    model: google/gemma-4-31B-it
    stream_usage: false
    # The summary is prepended to every chunk before embedding, so a long one
    # displaces chunk text inside the embedding model's window. This is the coarse
    # stop on runaway generation, sized so a compliant 60-word Swedish summary is
    # never cut; the enforced ceiling is worker-chunk's sentence-boundary
    # truncation, because a provider-side cut lands mid-word.
    max_tokens: 256

  # The strong end of the conversational agent: it plans the turn (reading intent
  # and setting a strategy, or replying directly to a chatty message) and writes
  # the streamed Swedish answer. Both are reasoning-heavy and low-volume, so this
  # can afford to be the strongest model here; the mechanical tool loop between
  # them runs on `orchestrate` instead.
  chat:
    model: zai-org/GLM-5.2

  # The conversational agent's executor tool loop, carrying out a plan `chat`
  # already set. Reliable tool-calling across several turns rather than reasoning
  # about intent, and it writes no prose — so, like `sql` and `read`, it does not
  # need the chat model.
  orchestrate:
    model: openai/gpt-oss-120b

  # Reading one whole decision on the conversational agent's behalf. Sees a full
  # document — median ~7k characters, p90 ~21k, worst case ~165k — so like
  # `summarize` it wants context length. It is a sub-agent: the orchestrator
  # hands it a document and a question and gets a focused extract back, which is
  # what keeps whole decisions out of the orchestrator's own context.
  read:
    model: openai/gpt-oss-120b

  # Text-to-SQL over the corpus. Low volume, needs reliable tool-calling across
  # several turns, and writes no prose — so it does not need the chat model. The
  # hard part of this task is not SQL syntax but grounding a Swedish predicate in
  # the messy free-text values the columns actually hold, and that is enforced in
  # code rather than left to the model (see /decisions/sql-agent.md), which is
  # what makes a mid-tier model defensible here.
  sql:
    model: openai/gpt-oss-120b
embedding:
  # A name from `providers` above, or the literal "local" to run
  # sentence-transformers in-process (no API key, no network).
  provider: local
  model: intfloat/multilingual-e5-large
  # Must match the model's output width (e5-large=1024, e5-base=768) AND
  # EMBEDDING_DIMENSION AND the chunks.embedding column. verify_embedding_dimension()
  # checks all of them agree at startup.
  dimension: 1024
  # The model's max sequence length is deliberately NOT declared here. Unlike the
  # dimension — which the chunks.embedding column must independently agree with —
  # nothing outside the process constrains the window, so the tokenizer is its
  # only honest source. worker-chunk reads it at startup and derives its token
  # budget from it; see /decisions/embedding-window.md.
  #
  # A process that cannot reach the tokenizer at all sets EMBEDDING_WINDOW_OVERRIDE
  # in the environment: the window becomes that number, no tokenizer is loaded, and
  # chunk sizes fall back to a pessimistic character estimate. Environment-only on
  # purpose — one machine opting out is not the same as the file declaring a second
  # source of truth for every machine.
  #
  # e5 is an asymmetric model: the two sides of retrieval are prefixed
  # differently, and BOTH must be applied or queries and passages land in
  # systematically offset regions of the space. Set both to "" for a model that
  # does not use prefixes (bge-m3, jina).
  # Changing either value invalidates every stored embedding.
  query_prefix: "query: "
  passage_prefix: "passage: "
