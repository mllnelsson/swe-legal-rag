[project]
name = "church-legal-db"
version = "0.1.0"
description = "Church legal document database"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# PyTorch dropped Intel Mac wheels after 2.2.2. Declare Intel Mac as a supported
# environment and constrain torch there so uv forks the resolution: Intel Mac
# gets torch<=2.2.2, other platforms stay on the latest torch.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
constraint-dependencies = [
    "torch<=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # torch 2.2.2 is compiled against the NumPy 1.x C ABI. NumPy 2 removed
    # `_ARRAY_API`, so torch's numpy bridge fails to initialise and
    # `transformers.is_torch_available()` silently returns False — which makes
    # importing transformers raise `NameError: name 'nn' is not defined`.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # transformers 5 requires torch >= 2.4 and disables torch entirely below it,
    # which breaks its own imports. transformers 4 supports torch 2.2.
    "transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "alembic>=1.13",
    "shared",
    "worker-crawl",
    "worker-download",
    "worker-parse",
    "worker-metadata",
    "worker-extract",
    "worker-chunk",
    "worker-embed",
    "ai",
    "api",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21",
]

[tool.uv.sources]
shared = { workspace = true }
worker-crawl = { workspace = true }
worker-download = { workspace = true }
worker-parse = { workspace = true }
worker-metadata = { workspace = true }
worker-extract = { workspace = true }
worker-chunk = { workspace = true }
worker-embed = { workspace = true }
ai = { workspace = true }
api = { workspace = true }

[tool.ruff]
target-version = "py312"
src = ["packages/*/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Integration tests are excluded by default: they need a Postgres and they
# truncate every table, so running them has to be a deliberate act. A `-m` on the
# command line overrides the one here — `-m integration` for those alone, `-m ""`
# for everything.
addopts = ["--import-mode=importlib", "-m", "not integration", "--strict-markers"]
testpaths = [
    "packages/shared/tests",
    "packages/worker-crawl/tests",
    "packages/worker-download/tests",
    "packages/worker-parse/tests",
    "packages/worker-metadata/tests",
    "packages/ai/tests",
    "packages/worker-extract/tests",
    "packages/worker-chunk/tests",
    "packages/worker-embed/tests",
    "packages/api/tests",
    "packages/llm-core/tests",
    "scripts/tests",
]
markers = [
    "integration: needs a Postgres on TEST_DATABASE_URL; applied automatically to everything under tests/integration/ by the root conftest",
]
