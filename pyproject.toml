[project]
name = "church-legal-db"
version = "0.1.0"
description = "Church legal document database"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "alembic>=1.13",
    "shared",
    "worker-crawl",
    "worker-download",
    "worker-parse",
    "worker-metadata",
    "ai",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.21",
]

[tool.uv.sources]
shared = { workspace = true }
worker-crawl = { workspace = true }
worker-download = { workspace = true }
worker-parse = { workspace = true }
worker-metadata = { workspace = true }
ai = { workspace = true }

[tool.ruff]
target-version = "py312"
src = ["packages/*/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = ["packages/shared/tests", "packages/worker-crawl/tests", "packages/worker-download/tests", "packages/worker-parse/tests", "packages/worker-metadata/tests"]
markers = [
    "integration: marks tests as integration tests requiring a running database",
]
