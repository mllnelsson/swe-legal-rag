[project]
name = "church-legal-db"
version = "0.1.0"
description = "Church legal document database"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["ruff>=0.11", "alembic>=1.13", "shared"]

[tool.uv.sources]
shared = { workspace = true }

[tool.ruff]
target-version = "py312"
src = ["packages/*/src"]
