[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "ai",
    # The SQL agent behind POST /api/sql. The route is a thin adapter; the loop,
    # its tools and the read-only sandbox all live in `agents`.
    "agents",
    # The agent core, imported directly (it reaches past `ai`): `agent_kit.llm`
    # for services/retriever.py's rerank call, plus `ContextStore`/`JsonBlob` for
    # the chat session's carry-over store.
    "agent-kit",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
shared = { workspace = true }
ai = { workspace = true }
agents = { workspace = true }
agent-kit = { git = "ssh://git@github.com/mllnelsson/agent-kit.git", tag = "v0.1.0" }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
