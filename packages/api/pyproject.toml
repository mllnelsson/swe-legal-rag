[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "ai",
    # The SQL agent behind POST /api/sql. The route is a thin adapter; the loop,
    # its tools and the read-only sandbox all live in `agents`.
    "agents",
    # Imported directly by services/retriever.py for its rerank call, which
    # reaches past `ai`. Declared rather than left to resolve through `ai`.
    "llm-core",
    # The agent core: `ContextStore`/`JsonBlob` for the chat session's carry-over
    # store. Imported directly, the same as llm-core.
    "agent-kit",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
shared = { workspace = true }
ai = { workspace = true }
agents = { workspace = true }
llm-core = { workspace = true }
agent-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
