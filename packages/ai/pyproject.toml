[project]
name = "ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "llm-core",
    # The domain-free agent core. `ai` supplies the Swedish templates, evidence
    # formatters and embedding config that agent-kit deliberately does not carry.
    "agent-kit",
    "pydantic-settings>=2.0",
    # Reads llm_config.yaml — the per-task model/provider assignment.
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "openai>=1.0",
    # Imported directly to normalise the local provider's encode output. Arrives
    # transitively via sentence-transformers too, but a direct import is a direct
    # dependency. The Intel Mac ceiling is pinned in the root pyproject.
    "numpy",
    # Imported directly by ai.tokenization to measure text in the embedding
    # model's own tokens. Same story as numpy: transitive via
    # sentence-transformers, but a direct import is a direct dependency. No upper
    # bound here — the Intel Mac ceiling is pinned in the root pyproject, and a
    # second ceiling would fight it.
    "transformers>=4.40",
]

[tool.uv.sources]
shared = { workspace = true }
llm-core = { workspace = true }
agent-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
