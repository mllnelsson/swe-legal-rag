[project]
name = "ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "llm-core",
    "pydantic-settings>=2.0",
    "sentence-transformers>=3.0",
]

[tool.uv.sources]
shared = { workspace = true }
llm-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
