[project]
name = "agent-kit"
version = "0.1.0"
requires-python = ">=3.12"
# Deliberately narrow: this package is the domain-free agent core, meant to be
# lifted into other projects. It leans on llm-core for the provider abstraction
# and the tool loop, and on pydantic/pyyaml for its config and DTOs — nothing
# from `shared`, `ai` or `agents`. Keep it that way; the boundary is the point.
dependencies = [
    "llm-core",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Reads the LLM role/provider config document (providers + roles + defaults).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
llm-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
