[project]
name = "agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "ai",
    # The agent core, imported directly (it reaches past `ai`): `agent_kit.llm`
    # for `tool_loop`, `ToolDefinition` and the loop's error types, plus the
    # generic orchestrator, synthesis and context store the chat agent configures.
    "agent-kit",
]

[tool.uv.sources]
shared = { workspace = true }
ai = { workspace = true }
agent-kit = { git = "ssh://git@github.com/mllnelsson/agent-kit.git", tag = "v0.1.0" }

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
