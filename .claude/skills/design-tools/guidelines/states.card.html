<!-- @dsCard group="Brand" viewport="700x140" name="Interaction states" subtitle="Hover warms, press sinks 0.5px, focus rings apricot." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.grid{display:flex;gap:10px}.tk{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div class="grid" style="align-items:center">
 <div style="height:38px;padding:0 20px;display:flex;align-items:center;border-radius:var(--radius-sm);background:var(--burgundy-600);color:var(--apricot-50);font-size:15px;font-weight:600;box-shadow:var(--shadow-xs)">Rest</div>
 <div style="height:38px;padding:0 20px;display:flex;align-items:center;border-radius:var(--radius-sm);background:var(--burgundy-500);color:var(--apricot-50);font-size:15px;font-weight:600">Hover</div>
 <div style="height:38px;padding:0 20px;display:flex;align-items:center;border-radius:var(--radius-sm);background:var(--burgundy-700);color:var(--apricot-50);font-size:15px;font-weight:600;transform:translateY(.5px)">Press</div>
 <div style="height:38px;padding:0 20px;display:flex;align-items:center;border-radius:var(--radius-sm);background:var(--burgundy-600);color:var(--apricot-50);font-size:15px;font-weight:600;box-shadow:var(--ring-focus)">Focus</div>
 <div style="height:38px;padding:0 20px;display:flex;align-items:center;border-radius:var(--radius-sm);background:var(--burgundy-600);color:var(--apricot-50);font-size:15px;font-weight:600;opacity:.42">Disabled</div></div>
 <div class="tk" style="margin-top:12px">Focus ring: 3px rgba(239,162,111,.45). Never blue, never removed.</div></body></html>
