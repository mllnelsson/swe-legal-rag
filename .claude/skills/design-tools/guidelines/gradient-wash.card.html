<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.grid{display:flex;gap:10px}.tk{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div style="display:flex;flex-direction:column;gap:8px"><div style="height:34px;border-radius:6px;background:var(--gradient-wash);border:1px solid var(--apricot-200);display:flex;align-items:center;padding:0 12px;font-family:var(--font-mono);font-size:10px;color:var(--burgundy-600)">wash</div><div style="height:34px;border-radius:6px;background:var(--gradient-wash-soft);border:1px solid var(--apricot-200);display:flex;align-items:center;padding:0 12px;font-family:var(--font-mono);font-size:10px;color:var(--burgundy-600)">wash-soft</div><div style="height:34px;border-radius:6px;background:var(--gradient-wash-horizontal);border:1px solid var(--apricot-200);display:flex;align-items:center;padding:0 12px;font-family:var(--font-mono);font-size:10px;color:var(--burgundy-600)">wash-horizontal</div></div></body></html>
