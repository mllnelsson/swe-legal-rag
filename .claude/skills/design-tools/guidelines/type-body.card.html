<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.grid{display:flex;gap:10px}.tk{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><p style="font-size:17px;line-height:1.6;max-width:60ch;color:var(--text-body)">Body large, 17px. Used for the answer summary and marketing paragraphs, capped at 68 characters.</p>
 <p style="font-size:15px;line-height:1.55;max-width:60ch;color:var(--text-body);margin-top:10px">Body, 15px. The default for interface text, list rows and form values.</p>
 <p style="font-size:13px;line-height:1.45;color:var(--text-muted);margin-top:10px">Small, 13px — metadata, hints, table cells.</p>
 <p style="font-size:12px;line-height:1.35;color:var(--text-faint);margin-top:6px">Caption, 12px — timestamps and counts. Nothing smaller ships.</p></body></html>
