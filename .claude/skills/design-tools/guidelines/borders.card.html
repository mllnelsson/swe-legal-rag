<!-- @dsCard group="Brand" viewport="700x140" name="Borders & rules" subtitle="Hairline everywhere; apricot rule marks quoted matter." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.grid{display:flex;gap:10px}.tk{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div style="display:flex;flex-direction:column;gap:12px">
 <div style="height:1px;background:var(--border-hairline)"></div><div class="tk">--border-hairline · card and divider default</div>
 <div style="height:1px;background:var(--border-default)"></div><div class="tk">--border-default · form controls</div>
 <div style="padding-left:16px;border-left:2px solid var(--apricot-300);font-size:13px;color:var(--text-body)">Quoted passages carry a 2px apricot rule — never a full box.</div>
 <div style="height:3px;background:var(--gradient-rule);border-radius:2px"></div><div class="tk">--gradient-rule · section opener</div></div></body></html>
