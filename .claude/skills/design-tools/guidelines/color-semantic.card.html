<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Four states, always as tint + ink pairs." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.grid{display:flex;gap:10px}.tk{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div class="grid"><div style="flex:1;background:var(--status-ok-bg);color:var(--status-ok-fg);border-radius:6px;padding:12px 14px"><div style="font-weight:600;font-size:13px">Followed</div><div class="tk" style="color:inherit;opacity:.7;margin-top:6px">--status-ok-bg<br>--status-ok-fg</div></div><div style="flex:1;background:var(--status-warn-bg);color:var(--status-warn-fg);border-radius:6px;padding:12px 14px"><div style="font-weight:600;font-size:13px">Criticized</div><div class="tk" style="color:inherit;opacity:.7;margin-top:6px">--status-warn-bg<br>--status-warn-fg</div></div><div style="flex:1;background:var(--status-error-bg);color:var(--status-error-fg);border-radius:6px;padding:12px 14px"><div style="font-weight:600;font-size:13px">Overruled</div><div class="tk" style="color:inherit;opacity:.7;margin-top:6px">--status-error-bg<br>--status-error-fg</div></div><div style="flex:1;background:var(--status-info-bg);color:var(--status-info-fg);border-radius:6px;padding:12px 14px"><div style="font-weight:600;font-size:13px">Pending appeal</div><div class="tk" style="color:inherit;opacity:.7;margin-top:6px">--status-info-bg<br>--status-info-fg</div></div></div></body></html>
