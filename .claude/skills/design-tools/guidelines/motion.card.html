<!-- @dsCard group="Brand" viewport="700x130" name="Motion" subtitle="Short, flat easing. Nothing bounces." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-card);padding:18px 20px;font-family:var(--font-sans);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:var(--font-mono)}.grid{display:flex;gap:10px}.tk{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}</style>
</head><body><div style="display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--text-muted)">
 <div style="display:flex;gap:14px;align-items:center"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:110px">--dur-instant</span><span style="width:52px">80ms</span><span>press feedback</span></div><div style="display:flex;gap:14px;align-items:center"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:110px">--dur-fast</span><span style="width:52px">140ms</span><span>hover, focus ring</span></div><div style="display:flex;gap:14px;align-items:center"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:110px">--dur-base</span><span style="width:52px">200ms</span><span>toggles, shadows</span></div><div style="display:flex;gap:14px;align-items:center"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:110px">--dur-slow</span><span style="width:52px">320ms</span><span>toast in/out</span></div><div style="display:flex;gap:14px;align-items:center"><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:110px">--dur-panel</span><span style="width:52px">420ms</span><span>drawer, side panel</span></div>
 <div class="tk" style="margin-top:4px">Easing: cubic-bezier(0.2, 0, 0.2, 1) for everything interactive.</div></div></body></html>
