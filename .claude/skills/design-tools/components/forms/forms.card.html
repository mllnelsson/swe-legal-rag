</head><body><div id="root"></div><script type="text/babel">
const { SearchField, Input, Select, Checkbox, Radio, Switch } = window.SvkBeslutsokDesignSystem_46c55d;

function Demo(){const [q,setQ]=React.useState("carrier duty to consignee");const [c,setC]=React.useState(true);const [s,setS]=React.useState(true);

</div>

<Switch checked={s} onChange={setS} label="Unpublished opinions"/></div>
</div>}
